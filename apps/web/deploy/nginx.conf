# agentcut.studio, on the box the owner's other sites run on. Installed as
# /etc/nginx/sites-available/agentcut with a link in sites-enabled, beside postgun's.
# Cloudflare proxies the domain (an A record on this machine's address) and talks to this
# vhost over TLS, against the self-signed certificate in /etc/nginx/ssl/agentcut — the
# same arrangement postgun.ai has, so the zone's SSL mode is Full, not Full (strict).

server {
    listen 80;
    server_name agentcut.studio www.agentcut.studio;
    return 301 https://agentcut.studio$request_uri;
}

# One address for the site: the API answers with URLs built from the request's origin, so
# www would otherwise hand out install URLs on a second hostname.
server {
    listen 443 ssl;
    server_name www.agentcut.studio;

    ssl_certificate /etc/nginx/ssl/agentcut/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/agentcut/privkey.pem;

    return 301 https://agentcut.studio$request_uri;
}

server {
    listen 443 ssl;
    server_name agentcut.studio;

    ssl_certificate /etc/nginx/ssl/agentcut/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/agentcut/privkey.pem;

    # A pack's cover and screenshots are proxied from GitHub, and a pack page carries its
    # style guide: a few hundred kilobytes of HTML is not unusual.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app builds canonical URLs from this and checks a form's Origin against it.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
